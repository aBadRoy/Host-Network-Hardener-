[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "host-network-hardener"
version = "1.1.0"
description = "Host & Network Hardener - security assessment, hardening and remediation engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "D1", email = "93693542+aBadRoy@users.noreply.github.com" },
]
keywords = [
    "security", "scanner", "network", "hardening", "pentest",
    "cve", "vulnerability", "reconnaissance", "tls", "http",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.4.5",
    "cryptography>=39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyflakes>=3.0",
    "ruff>=0.4",
]

[project.scripts]
hardener = "hardener.cli:main"

[tool.setuptools]
packages = ["hardener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "UP006", # keep typing.List/Optional for py3.9 clarity
]
